name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Deploy direto na nuvem da Vercel (sem pull/build local): as env vars
      # de produção são "Sensitive" e só a Vercel consegue resolvê-las durante
      # o build dela. `vercel pull`/`vercel build` localmente as recebem como
      # "[SENSITIVE]" (placeholder), quebrando o build. Ver 02-Decisoes no
      # segundo cérebro do Rafael para o incidente que motivou isso.
      - name: Deploy to Vercel Production
        run: vercel deploy --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
